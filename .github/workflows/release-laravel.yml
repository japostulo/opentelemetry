name: Release — haoc/opentelemetry-laravel

on:
  push:
    branches:
      - main
    paths:
      - 'packages/laravel/**'
      - '!packages/laravel/CHANGELOG.md'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.check.outputs.released }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Release
        working-directory: packages/laravel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release-monorepo

      - name: Read release version
        id: check
        run: |
          if [ -f packages/laravel/.release-version ]; then
            VERSION=$(cat packages/laravel/.release-version)
            echo "released=true"  >> $GITHUB_OUTPUT
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi

  split:
    name: Split to opentelemetry-laravel repo
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout monorepo (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push split to mirror repo
        env:
          SPLIT_TOKEN: ${{ secrets.MONOREPO_SPLIT_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          SPLIT_REPO: "japostulo/opentelemetry-laravel"
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Clone the split repo
          git clone "https://x-access-token:${SPLIT_TOKEN}@github.com/${SPLIT_REPO}.git" /tmp/split-repo

          # Sync contents (exclude monorepo-only files)
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.releaserc.json' \
            --exclude='package.json' \
            --exclude='.release-version' \
            --exclude='node_modules/' \
            packages/laravel/ /tmp/split-repo/

          # Commit and push branch
          cd /tmp/split-repo
          git add -A
          git diff --cached --quiet || git commit -m "chore: sync from monorepo haoc/opentelemetry-laravel@${VERSION} [skip ci]"
          git push origin main

          # Create and push version tag (format Packagist expects: X.Y.Z)
          git tag "${VERSION}"
          git push origin "${VERSION}"
