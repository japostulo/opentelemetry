services:
  # ─── Packages watcher ─────────────────────────────────────────────────────────
  # Compiles packages/node and packages/web in --watch mode.
  # The compiled dist/ is written back into the bind-mounted host directory,
  # making it visible to all other containers that mount the same path.
  packages-watcher:
    build:
      context: ..
      dockerfile: playground/Dockerfile.packages-watcher
    volumes:
      - ../packages/node:/workspace/packages/node
      - ../packages/web:/workspace/packages/web
    networks:
      - playground

  nestjs-app:
    build:
      context: ..
      dockerfile: playground/nestjs-app/Dockerfile.dev
    depends_on:
      - packages-watcher
    command: npm run dev
    ports:
      - "3010:3010"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
      OTEL_SERVICE_NAME: playground-nestjs
      OTEL_ENVIRONMENT: playground
      NODE_ENV: development
      OTEL_PROFILE: ${OTEL_PROFILE:-standard}
      OTEL_CAPTURE_BODY: ${OTEL_CAPTURE_BODY:-}
      OTEL_CAPTURE_RESPONSE: ${OTEL_CAPTURE_RESPONSE:-}
      LOG_DESTINATION: ${LOG_DESTINATION:-both}
    volumes:
      # Live lib source + dist (updated by packages-watcher)
      - ../packages/node:/workspace/packages/node
      # Live app source
      - ./nestjs-app/src:/workspace/playground/nestjs-app/src
    working_dir: /workspace/playground/nestjs-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - playground

  express-app:
    build:
      context: ..
      dockerfile: playground/express-app/Dockerfile.dev
    depends_on:
      - packages-watcher
    command: npm run dev
    ports:
      - "3020:3020"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
      OTEL_SERVICE_NAME: playground-express
      OTEL_ENVIRONMENT: playground
      NODE_ENV: development
      OTEL_PROFILE: ${OTEL_PROFILE:-standard}
      OTEL_CAPTURE_BODY: ${OTEL_CAPTURE_BODY:-}
      OTEL_CAPTURE_RESPONSE: ${OTEL_CAPTURE_RESPONSE:-}
      LOG_DESTINATION: ${LOG_DESTINATION:-both}
    volumes:
      - ../packages/node:/workspace/packages/node
      - ./express-app/src:/workspace/playground/express-app/src
    working_dir: /workspace/playground/express-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - playground

  laravel-app:
    build:
      context: ..
      dockerfile: playground/laravel-app/Dockerfile
    ports:
      - "8085:8080"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318
      OTEL_SERVICE_NAME: playground-laravel
      OTEL_ENVIRONMENT: playground
      APP_KEY: base64:c2VjdXJlLXBsYXlncm91bmQta2V5LTEyMzQ1Njc4OTA=
      APP_ENV: local
      APP_DEBUG: "true"
      OTEL_PROFILE: ${OTEL_PROFILE:-standard}
      OTEL_CAPTURE_BODY: ${OTEL_CAPTURE_BODY:-}
      OTEL_CAPTURE_RESPONSE: ${OTEL_CAPTURE_RESPONSE:-}
      LOG_DESTINATION: ${LOG_DESTINATION:-both}
    volumes:
      # Hot-reload: Composer installed the package as a symlink (symlink:true).
      # This bind mount fills the symlink target with live host source.
      # Changes to packages/laravel/src/** are visible on the next request
      # without rebuilding or restarting the container.
      - ../packages/laravel:/packages/laravel
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - playground

  web-app:
    build:
      context: ..
      dockerfile: playground/web-app/Dockerfile.dev
    depends_on:
      - packages-watcher
    command: npm run dev -- --host 0.0.0.0 --port 8090
    ports:
      - "8090:8090"
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../packages/web:/workspace/packages/web
      - ./web-app/src:/workspace/playground/web-app/src
      - ./web-app/index.html:/workspace/playground/web-app/index.html
      - ./web-app/vite.config.ts:/workspace/playground/web-app/vite.config.ts
    working_dir: /workspace/playground/web-app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - playground

networks:
  playground:
    driver: bridge
